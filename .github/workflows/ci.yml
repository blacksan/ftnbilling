name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '14']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ispbill_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ispbill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ispbill_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go mod verify
      # The installer builds from source with -mod=vendor: the vendor folder must match go.mod.
      - run: go build -mod=vendor -o /dev/null ./cmd/ispbill
      - run: go vet ./...
      - run: go vet -tags nopg ./cmd/...
      # JSON backend everywhere, plus the Postgres-only tests (TEST_DATABASE_URL is set).
      - run: go test -count=1 ./...
      # The same suites on the Postgres backend; -p 1 because they share one database server.
      - run: TEST_STORE=postgres go test -count=1 -p 1 ./internal/billing/... ./internal/payments/... ./internal/sites/... ./internal/web/... ./internal/store/...
      - run: go test -race -count=1 ./internal/store/...
      # The router image has no Postgres: it must still build with -tags nopg.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags nopg -trimpath -o /dev/null ./cmd/ispbill
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/ispbill
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in deploy/install.sh deploy/ftnbilling-backup deploy/ftnbilling-wg-sync deploy/ftnbilling-admin-reset deploy/ftnbilling-wipe deploy/ftnbilling-doctor deploy/ftnbilling-mgmt build.sh; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -S warning deploy/install.sh deploy/ftnbilling-backup deploy/ftnbilling-wg-sync deploy/ftnbilling-admin-reset deploy/ftnbilling-wipe deploy/ftnbilling-doctor deploy/ftnbilling-mgmt build.sh
      - name: installer dry run
        run: |
          DRY_RUN=1 DOMAIN=billing.example.co.ke bash deploy/install.sh | tee /tmp/dry.txt
          # udp/51821 and 10.98.0.0/24 are wg-mgmt's (remote WinBox) defaults now; the retired admin VPN is still not allowed.
          if grep -Ei 'wg-admin|admin-peer' /tmp/dry.txt; then echo "the installer must not create the admin VPN"; exit 1; fi
          grep -q 'wg-mgmt' /tmp/dry.txt
      - name: Caddyfile validates with a real Caddy
        run: |
          v=2.8.4
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${v}/caddy_${v}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" version
          CADDY_BIN="$RUNNER_TEMP/caddy" go test -count=1 -run 'TestInstallCaddyfile' -v ./deploy
      - name: systemd calendar expressions
        run: |
          for f in deploy/*.timer; do grep -H '^OnCalendar' "$f"; done
          systemd-analyze calendar '*-*-* 00,06,12,18:17:00 UTC' '*-*-01 03:40:00 UTC'
